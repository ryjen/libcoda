name: CI

on:
  push:
    branches:
      - development
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aggregate-build:
    name: Aggregate release build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libboost-dev \
            libcurl4-openssl-dev \
            libjson-c-dev \
            libmariadb-dev \
            libpq-dev \
            libsqlite3-dev \
            libssl-dev \
            liburiparser-dev \
            ninja-build \
            pkg-config

      - name: Configure
        shell: bash
        run: |
          set +e
          cmake --preset release \
            -G Ninja \
            -DENABLE_TEST_DB_FIXTURES=OFF \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            2>&1 | tee configure.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 30 configure.log | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=CMake configure failed::$message"
            exit "$status"
          fi

      - name: Build
        shell: bash
        run: |
          set +e
          cmake --build --preset release --parallel 2 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 30 build.log | tr '\n' ' ' | sed 's/%/%25/g')
            echo "::error title=Aggregate build failed::$message"
            exit "$status"
          fi
